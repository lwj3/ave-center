version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: ave-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-ave_center}
      MYSQL_USER: ${DB_USER:-ave_center}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ave_center_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/utils/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M    # 缓冲池（根据服务器内存调整）
      - --max-connections=200             # 最大连接数
      - --wait-timeout=60                 # 等待超时
      - --innodb-log-file-size=64M        # redo log 大小
    networks:
      - ave-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # 后端 Node.js 服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ave-server
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ave_center}
      DB_USER: ${DB_USER:-ave_center}
      DB_PASSWORD: ${DB_PASSWORD:-ave_center_pass}
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-ave-center-secret-key-2026}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ave-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s     # 启动宽限期
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2.0'

  # 前端 Nginx 服务
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    container_name: ave-client
    restart: always
    ports:
      - "80:80"
    volumes:
      - uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - ave-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

volumes:
  mysql_data:
  uploads:

networks:
  ave-network:
    driver: bridge
