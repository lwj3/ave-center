<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AVE 学习中心</title>
  <script>
    // GitHub Pages SPA 路由回退
    var path = window.location.pathname;
    if (path !== '/' && !path.includes('.')) {
      sessionStorage.setItem('redirect_path', path);
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>页面加载中...</p>
</body>
</html>
