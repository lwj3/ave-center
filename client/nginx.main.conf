# Nginx 全局配置
worker_processes auto;           # 根据 CPU 核数自动设置
worker_rlimit_nofile 65535;      # 最大文件描述符数

events {
    worker_connections 1024;     # 每个 worker 最大连接数
    multi_accept on;             # 一次接受所有连接
    use epoll;                   # Linux 高性能事件模型
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 性能优化
    sendfile on;
    tcp_nopush on;               # 配合 sendfile 优化数据包发送
    tcp_nodelay on;              # 减少小包延迟
    keepalive_timeout 65;        # 长连接超时
    keepalive_requests 100;      # 单连接最大请求数
    types_hash_max_size 2048;

    # Gzip 压缩（大幅减少传输体积）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;           # 压缩级别（1-9，6 是平衡点）
    gzip_min_length 256;         # 小于 256 字节不压缩
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 安全头
    server_tokens off;           # 隐藏 Nginx 版本号

    # 引入站点配置
    include /etc/nginx/conf.d/*.conf;
}
